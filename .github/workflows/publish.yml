name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  test:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendia-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opendia-mcp/package-lock.json
      - run: npm ci
      - name: Syntax-check server
        run: node --check server.js
      - name: Protocol tests
        run: node test-protocol.js
      - name: Connection tests
        run: node test-connection.js

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendia-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5
      - run: npm install -g npm@latest
      # Auth via OIDC trusted publishing (configured on npmjs.com) — no token
      - run: npm publish --provenance --access public
